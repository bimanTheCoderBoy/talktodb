[tool.uv.workspace]
members = [
    "agent_server",
    "shared_server_libs",
    "rag_retrieval_server",
]
[dependency-groups]
dev = [
    "poethepoet",
    "pytest",
    "ruff",
]

# ── Dev run ──────────────────────────────────────────────────────────────
[tool.poe.tasks.dev]
help = "Start base dev env (postgres, phoenix, redis, agent_server, frontend, rag)"
cmd  = "setup/dev/run.bat -base"

[tool.poe.tasks."dev:rag"]
help = "Start base + RAG retrieval server (same as dev; RAG is included in base)"
cmd  = "setup/dev/run.bat -base"

# ── Local build ──────────────────────────────────────────────────────────
[tool.poe.tasks.local-build]
help = "Show build usage"
cmd  = "setup/scripts/local-build/local-build.bat"

[tool.poe.tasks."local-build:agent"]
help = "Build agent_server (LangGraph) wheels"
cmd  = "setup/scripts/local-build/local-build.bat -langgraph"

[tool.poe.tasks."local-build:rag"]
help = "Build RAG retrieval server wheels"
cmd  = "setup/scripts/local-build/local-build.bat -rag"

[tool.poe.tasks."local-build:all"]
help = "Build all service wheels"
cmd  = "setup/scripts/local-build/local-build.bat -all"

[tool.poe.tasks."local-build:deps"]
help = "Build all + force re-export requirements.txt"
cmd  = "setup/scripts/local-build/local-build.bat -all -deps"

# ── Deploy ───────────────────────────────────────────────────────────────

[tool.poe.tasks.deploy]
help = "Deploy to host: poe deploy <hostname> <smb-user> <smb-password>"
cmd = "setup/scripts/deploy/deploy-to-host.bat ${hostname} ${smb_user} ${smb_password}"

[[tool.poe.tasks.deploy.args]]
name = "hostname"
positional = true
required = true
help = "Target hostname"

[[tool.poe.tasks.deploy.args]]
name = "smb_user"
positional = true
required = true
help = "SMB username"

[[tool.poe.tasks.deploy.args]]
name = "smb_password"
positional = true
required = true
help = "SMB password"

# ── Single Image Build ──────────────────────────────────────────────────

[tool.poe.tasks."single-image-build"]
help = "After building all wheels with local-build, build a single Docker image tar for the entire application in the root /dist folder"
cmd = "setup/scripts/deploy/create-dist.bat"
