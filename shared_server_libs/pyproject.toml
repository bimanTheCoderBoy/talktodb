[project]
name = "shared-server-libs"
version = "1.6.5"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "python-jose[cryptography]==3.5.0",
    "cryptography==50.0.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
lance = ["lancedb>=0.37.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_server_libs"]
