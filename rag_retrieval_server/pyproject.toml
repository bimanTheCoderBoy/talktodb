[project]
name = "rag-retrieval-server"
version = "1.6.1"
description = "RAG Retrieval Server\n This is a server for retrieving documents from a RAG system. Here you can query the RAG system and get the relevant documents."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-dotenv==1.2.3",
    "pydantic==2.13.4",
    "lancedb==0.37.1",
    "fastembed==0.8.0",
    "shared-server-libs[lance]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval_app"]

[tool.uv.sources]
shared-server-libs = { workspace = true }
