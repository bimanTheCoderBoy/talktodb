<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-dark: #0284c7;
            --border-color: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 40px;
            line-height: 1.6;
            font-size: 16px;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            margin-top: 1.5em;
            margin-bottom: 0.75em;
            line-height: 1.3;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-color);
            border-bottom: 2px solid var(--bg-tertiary);
            padding-bottom: 0.5em;
            margin-bottom: 1.5em;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #e2e8f0;
            border-left: 4px solid var(--accent-color);
            padding-left: 1rem;
        }

        h3 { font-size: 1.5rem; color: #cbd5e1; }
        
        p { margin-bottom: 1.2em; color: #cbd5e1; max-width: 80ch; }
        
        a { color: var(--accent-color); text-decoration: none; transition: color 0.2s; }
        a:hover { text-decoration: underline; color: var(--accent-dark); }

        /* Tables - Professional & Catchy */
        .table-wrapper {
            overflow-x: auto;
            margin: 2em 0;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: var(--bg-secondary);
            font-size: 0.875rem; /* 14px */
        }

        th {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 16px;
            text-align: left;
            border-bottom: 2px solid var(--accent-dark);
            white-space: nowrap; /* Keep headers on one line if possible */
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 300px; /* Prevent single column from dominating */
        }

        tr:last-child td { border-bottom: none; }
        
        tr:nth-child(even) { background-color: rgba(51, 65, 85, 0.3); }
        tr:hover { background-color: rgba(56, 189, 248, 0.05); }

        /* Code Blocks */
        pre {
            background: #0b1221;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 1.5em 0;
            overflow-x: auto;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            color: #e2e8f0;
        }
        
        p code {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 0.2em 0.4em;
            border-radius: 4px;
        }

        /* Mermaid Diagrams */
        .mermaid {
            background: var(--bg-secondary) !important;
            padding: 2rem;
            border-radius: 8px;
            margin: 2em 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid var(--accent-color);
            background: linear-gradient(to right, rgba(56, 189, 248, 0.05), transparent);
            padding: 1rem 1.5rem;
            margin: 1.5em 0;
            font-style: italic;
            color: var(--text-secondary);
            border-radius: 0 8px 8px 0;
        }
        
        /* Lists */
        ul, ol { margin-left: 1.5em; margin-bottom: 1.5em; color: #cbd5e1; }
        li { margin-bottom: 0.5em; }
        
        strong { color: #f8fafc; font-weight: 700; }
    </style>
</head>
<body>
   
    <div class="content">
        {{ content | safe }}
    </div>
    
    <script>
        // Initialize Mermaid with Dark Theme
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { 
                useMaxWidth: true,
                htmlLabels: true,
                curve: 'basis'
            },
            themeVariables: {
                darkMode: true,
                background: '#1e293b',
                primaryColor: '#38bdf8',
                secondaryColor: '#0ea5e9',
                tertiaryColor: '#1e293b',
                primaryTextColor: '#f1f5f9',
                secondaryTextColor: '#94a3b8',
                lineColor: '#94a3b8',
                mainBkg: '#1e293b',
                nodeBorder: '#38bdf8'
            }
        });

        // Advanced Table Auto-Scaling
        window.addEventListener('load', function() {
            // Delay slightly to ensure mermaid render doesn't shift things
            setTimeout(() => {
                const tables = document.querySelectorAll('table');
                const content = document.querySelector('.content');
                
                if (content && tables.length > 0) {
                    const maxWidth = content.clientWidth;
                    
                    tables.forEach(table => {
                        // Reset transformations to measure natural width
                        table.style.zoom = 1;
                        
                        if (table.offsetWidth > maxWidth) {
                            const scale = maxWidth / table.offsetWidth;
                            // Use CSS transform instead of zoom for better rendering quality if needed, 
                            // but zoom is often reliable for print/pdf generation in Chromium.
                            // Let's stick to zoom as it reflows document height better.
                            table.style.zoom = (scale * 0.98); // 98% to account for any border/padding nuances
                            table.style.width = '100%';
                        }
                    });
                }
            }, 500);
        });
    </script>
</body>
</html>
