[project]
name = "download-service"
version = "1.6.1"
requires-python = ">=3.12"

dependencies = [
    "celery==5.6.3",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "markdown==3.10.3",
    "playwright==1.62.0",
    "redis==8.1.0",
    "sse-starlette==3.3.4",
    "uvicorn[standard]==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["download_app"]