name: talktodb

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_data}
      POSTGRES_USER: ${POSTGRES_USER:-csv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csv_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup/scripts/postgres_init_scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csv_user} -d ${POSTGRES_DB:-langgraph_data}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  agent_server:
    image: server/agent:0.1.0
    build:
      context: ./agent_server
      dockerfile: Dockerfile
    container_name: agent_server
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag_retrieval_server:
        condition: service_healthy
    env_file:
      - ./setup/prod_envs/agent_server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URI=${REDIS_URI:-redis://redis:6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - POSTGRES_URI=${POSTGRES_URI:-postgres://csv_user:csv_password@postgres:5432/langgraph_data?sslmode=disable}
      - TALKTODB_DATA_DIR=/app/talktodb_data
    volumes:
      - ${TALKTODB_DATA_DIR}:/app/talktodb_data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "python", "/api/healthcheck.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx/staticserve-api-gateway:0.1.0
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_LANGGRAPH_API_URL=${VITE_LANGGRAPH_API_URL:-/langgraph-api}
        - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM:-aan}
        - VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID:-react-app-prod}
        - VITE_RAG_DOCUMENTATIONS_BASE_URL=${VITE_RAG_DOCUMENTATIONS_BASE_URL:-talktodb_data/document_rag/data}
        - VITE_RAG_IMAGES_BASE_URL=${VITE_RAG_IMAGES_BASE_URL:-talktodb_data/document_rag}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    environment:
      - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL:-https://localhost:8443}
    depends_on:
      agent_server:
        condition: service_healthy
    volumes:
      - ${TALKTODB_DATA_DIR}:/app/frontend/talktodb_data
      - ./setup/certs:/etc/nginx/certs:ro
    networks:
      - app_network

  rag_retrieval_server:
    image: server/rag:0.1.0
    build:
      context: ./rag_retrieval_server
      dockerfile: Dockerfile
    container_name: rag_retrieval_server
    restart: unless-stopped
    env_file:
      - ./setup/prod_envs/rag_retrieval_server/.env
    ports:
      - "${RAG_RETRIEVAL_SERVER_PORT:-8010}:8010"
    networks:
      - app_network
    volumes:
      - ${TALKTODB_DATA_DIR}:/app/talktodb_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8010/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
      
