[project]
name = "eds-pipeline"
version = "1.6.1"
requires-python = ">=3.12"
dependencies = [
    "shared-server-libs",
    "aiohttp==3.14.3",
    "apscheduler==3.11.3",
    "asyncpg==0.31.0",
    "geoalchemy2==0.20.0",
    "orjson==3.12.0",
    "pandas==2.3.3",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "pytz==2026.3.post1",
    "sqlalchemy==2.0.52",
    "streamlit==1.62.0",
    "watchdog==6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_app"]

[tool.uv.sources]
shared-server-libs = { workspace = true }