[project]
name = "asp-server"
version = "1.6.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-dotenv==1.2.3",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "numba==0.67.0",
    "aiofiles==25.1.0",
    "redis==8.1.0",
    "python-multipart==0.0.32",
    "celery==5.6.3",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "rasterio==1.5.1",
    "Pillow==12.3.0",
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "python-jose[cryptography]==3.5.0",
    "shared-server-libs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asp_app"]

[tool.uv.sources]
shared-server-libs = { workspace = true }